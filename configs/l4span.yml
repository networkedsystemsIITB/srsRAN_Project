# L4Span configuration section.

# This is a supplementary configuration file that enables L4Span ECN marking in the CU-UP (see README.md). It can be
# combined with any gNB or CU-UP base configuration, for example:
#   sudo ./gnb -c gnb_rf_b200_tdd_n78_20mhz.yml -c l4span.yml
# Only `enabled` needs to be set. The other values below are the defaults, which match the constants of the original
# L4Span implementation.

cu_up:
  l4span:
    enabled: true                       # Insert the MARK entity between GTP-U and SDAP.
    flow_idle_timeout_ms: 1000          # A flow type (L4S or classic) is considered gone after this long without packets.

    estimator:                          # Dequeue rate estimator of the per-DRB queue model.
      window_pkts: 50                   # Moving-average window of the dequeue rate predictor, in packets.
      min_rate_interval_us: 1000        # Reuse the previous dequeue rate if feedback arrives sooner than this.

    # Signalling per class and transport:
    #   dl_ce       CE-mark the DL packet. The receiver echoes it (RFC 3168 ECN or AccECN).
    #   ack_rewrite Leave the DL packet unmarked and rewrite the AccECN feedback of the UL ACKs (TCP only, needs AccECN).
    #   none        Do not signal. Marking probabilities are still computed and logged.

    l4s:                                # L4S (ECT(1)) flows.
      target_delay_us: 10000            # Target RLC queueing delay.
      legacy_prob_truncation: false     # Reproduce the integer truncation of the probability in the original L4Span.
      tcp: ack_rewrite                  # dl_ce | ack_rewrite | none
      udp: dl_ce                        # dl_ce | none

    classic:                            # Classic (ECT(0)) flows.
      max_queue_bytes: 225000           # Standing queue above which classic flows are marked. Divided by the number of UEs.
      mss_bytes: 1460                   # MSS used by the marking probability.
      beta: 1.75                        # Constant used by the marking probability.
      tcp: dl_ce                        # dl_ce | ack_rewrite | none. The original L4Span uses ack_rewrite.
      udp: dl_ce                        # dl_ce | none

    ack_rewrite:                        # Parameters of the UL AccECN rewrite, for classes using ack_rewrite.
      mss_bytes: 1336                   # Segment size assumed when synthesizing the AccECN counters.
      ce_pkt_offset: 5                  # Initial CE packet counter offset.
      l4s_ce_scale: 0.1                 # Scale of the CE portion reported to L4S flows.

log:
  mark_level: warning                   # Set to debug to log every marking decision.
